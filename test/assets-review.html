<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Boxhead FPS Asset Review</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #b8c1c6;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import * as THREE from "three";
      import {
        createCarbineModel,
        createGrenadeModel,
        createPalmTreeModel,
        createPickupModel,
        createStarfishModel,
      } from "/src/models/game-models.ts";

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xb8c1c6);
      scene.fog = new THREE.Fog(0xb8c1c6, 14, 28);
      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(innerWidth, innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;
      document.body.append(renderer.domElement);
      const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 80);
      camera.position.set(6.5, 3.7, 8.2);
      camera.lookAt(0, 1.1, 0);

      scene.add(new THREE.HemisphereLight(0xeaf5ff, 0x3d4938, 1.3));
      const key = new THREE.DirectionalLight(0xffeed4, 3.2);
      key.position.set(-6, 10, 7);
      key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048);
      key.shadow.radius = 5;
      scene.add(key);
      const rim = new THREE.DirectionalLight(0x9bd7ff, 1.1);
      rim.position.set(7, 4, -8);
      scene.add(rim);
      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(30, 24),
        new THREE.MeshStandardMaterial({ color: 0x7e8888, roughness: 0.94 })
      );
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);

      const carbine = createCarbineModel().group;
      carbine.position.set(0.5, 1.4, 1.1);
      carbine.rotation.set(0.1, -0.7, 0.04);
      carbine.scale.setScalar(1.25);
      scene.add(carbine);

      const health = createPickupModel("health");
      health.position.set(-2.6, 0.42, 0.45);
      scene.add(health);
      const shield = createPickupModel("shield");
      shield.position.set(-0.25, 0.38, -2.6);
      scene.add(shield);
      const grenade = createGrenadeModel();
      grenade.position.set(1.1, 0.3, -2.6);
      grenade.scale.setScalar(1.2);
      scene.add(grenade);
      const starfish = createStarfishModel(0.42);
      starfish.position.set(2.3, 0.04, -2.4);
      scene.add(starfish);

      const palm = createPalmTreeModel(4.5, 12345);
      palm.position.set(-4.1, 0, -2.2);
      palm.scale.setScalar(0.62);
      scene.add(palm);

      renderer.setAnimationLoop(() => {
        renderer.render(scene, camera);
        window.__assetsReviewReady = true;
      });
    </script>
  </body>
</html>
