<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Blast Crater Review</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #9da0a0;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import * as THREE from "three";
      import { createBlastMarkModel } from "/src/persistent-effects.ts";

      document.querySelectorAll("canvas").forEach((canvas) => canvas.remove());
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x9da0a0);
      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(1);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      document.body.append(renderer.domElement);
      const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 30);
      camera.position.set(2.7, 2.2, 3.8);
      camera.lookAt(0, 0, 0);
      scene.add(new THREE.HemisphereLight(0xe8f0f5, 0x39342f, 1.0));
      const key = new THREE.DirectionalLight(0xffe5c4, 3.2);
      key.position.set(-3, 5, 2);
      key.castShadow = true;
      key.shadow.radius = 5;
      scene.add(key);
      const grazing = new THREE.DirectionalLight(0xff8a4a, 1.4);
      grazing.position.set(4, 0.6, -2);
      scene.add(grazing);
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(12, 12),
        new THREE.MeshStandardMaterial({ color: 0x777a77, roughness: 0.98 })
      );
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);
      const crater = createBlastMarkModel();
      crater.rotation.x = -Math.PI / 2;
      crater.position.y = 0.012;
      crater.scale.setScalar(1.45);
      scene.add(crater);
      renderer.setAnimationLoop(() => {
        renderer.render(scene, camera);
        window.__craterReviewReady = true;
      });
    </script>
  </body>
</html>
