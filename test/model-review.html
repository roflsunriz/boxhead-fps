<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>FPS Carbine Review</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #dedede;
      }
      canvas {
        display: block;
      }
      #review-tools {
        position: fixed;
        left: 16px;
        bottom: 16px;
        padding: 12px 16px;
        color: #eee;
        background: #202427e8;
        font: 13px system-ui;
        border-radius: 8px;
      }
      #review-tools label {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      #part-name {
        margin-top: 6px;
        color: #a7d8d8;
      }
    </style>
  </head>
  <body>
    <aside id="review-tools" hidden>
      <div>ドラッグで回転 · ホイールで拡大 · 部品をクリック</div>
      <label>分解表示 <input id="explode" type="range" min="0" max="1" step="0.01" value="0" /></label>
      <div id="part-name">カービンライフル</div>
    </aside>
    <script type="module">
      import * as THREE from "three";
      import { RoomEnvironment } from "three/examples/jsm/environments/RoomEnvironment.js";
      import { OrbitControls } from "three/examples/jsm/controls/OrbitControls.js";
      import { createCarbineModel } from "/src/models/game-models.ts";
      import { carbineTexturesReady } from "/src/models/carbine-materials.ts";

      const params = new URLSearchParams(location.search);
      const view = params.get("view") ?? "reference";
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xdedede);

      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(innerWidth, innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.18;
      document.body.append(renderer.domElement);
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environmentIntensity = 0.7;

      const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.01, 100);
      const model = createCarbineModel().group;
      model.rotation.y = -Math.PI / 2;
      window.__carbineModel = model;
      if (params.get("flat") === "1") {
        model.traverse((object) => {
          if (!(object instanceof THREE.Mesh)) return;
          const source = Array.isArray(object.material) ? object.material[0] : object.material;
          const color = source && "color" in source ? source.color : new THREE.Color(0x70747a);
          object.material = new THREE.MeshBasicMaterial({ color });
        });
      }
      scene.add(model);
      scene.add(new THREE.HemisphereLight(0xf2f4ff, 0x363b42, 1.1));
      const key = new THREE.DirectionalLight(0xfff4e8, 3.1);
      key.position.set(-4, 6, 5.5);
      key.castShadow = true;
      key.shadow.radius = 6;
      scene.add(key);
      const fill = new THREE.DirectionalLight(0xa8c4ff, 0.85);
      fill.position.set(4, 3, 3.5);
      scene.add(fill);
      const rim = new THREE.DirectionalLight(0xfff1c4, 0.9);
      rim.position.set(0.5, 4.5, -6);
      scene.add(rim);

      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(30, 30),
        new THREE.ShadowMaterial({ color: 0x000000, opacity: 0.16 })
      );
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = -1.65;
      ground.receiveShadow = true;
      if (params.get("ground") === "1") scene.add(ground);

      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      const radius = Math.max(1, box.getBoundingSphere(new THREE.Sphere()).radius);
      const directions = {
        reference: new THREE.Vector3(0.4, 0.3, 1),
        side: new THREE.Vector3(0, 0, 1),
        rear: new THREE.Vector3(-1, 0.05, 0.001),
        opposite: new THREE.Vector3(-0.32, 0.18, -1),
        top: new THREE.Vector3(0.001, 1, 0.001),
        muzzle: new THREE.Vector3(1, 0.05, 0.001),
      };
      const direction = directions[view] ?? directions.reference;
      const distanceFactor = view === "muzzle" || view === "rear" ? 3.2 : view === "top" ? 2.8 : 2.35;
      camera.position.copy(center).addScaledVector(direction.normalize(), radius * distanceFactor);
      camera.lookAt(center);
      window.__modelReviewView = view;
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.copy(center);
      controls.enableDamping = true;
      if (params.get("interactive") === "1") {
        document.querySelector("#review-tools").hidden = false;
        const parts = model.children.filter((part) => part.isGroup);
        const positions = parts.map((part) => part.position.clone());
        const centers = parts.map((part) =>
          new THREE.Box3().setFromObject(part).getCenter(new THREE.Vector3())
        );
        const inverse = new THREE.Matrix4().copy(model.matrixWorld).invert();
        const localCenter = center.clone().applyMatrix4(inverse);
        const offsets = centers.map((partCenter) => partCenter.applyMatrix4(inverse).sub(localCenter));
        document.querySelector("#explode").addEventListener("input", (event) => {
          const amount = Number(event.target.value);
          parts.forEach((part, i) => part.position.copy(positions[i]).addScaledVector(offsets[i], amount));
        });
        const ray = new THREE.Raycaster();
        renderer.domElement.addEventListener("click", (event) => {
          ray.setFromCamera(
            new THREE.Vector2((event.clientX / innerWidth) * 2 - 1, 1 - (event.clientY / innerHeight) * 2),
            camera
          );
          const hit = ray.intersectObject(model, true)[0];
          if (hit) {
            let part = hit.object;
            while (part.parent && !parts.includes(part)) part = part.parent;
            const labels = {
              "receiver-assembly": "レシーバー",
              "stock-assembly": "ストック",
              "grip-assembly": "グリップ",
              "magazine-assembly": "弾倉",
              "handguard-assembly": "ハンドガード",
              "barrel-assembly": "銃身・銃口",
              "top-rail": "上部レール",
              "optic-assembly": "サイト",
            };
            document.querySelector("#part-name").textContent = labels[part.name] ?? "カービンライフル";
          }
        });
      }
      addEventListener("resize", () => {
        renderer.setSize(innerWidth, innerHeight);
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
      });

      await carbineTexturesReady;
      renderer.setAnimationLoop(() => {
        controls.update();
        renderer.render(scene, camera);
        window.__modelReviewReady = true;
      });
    </script>
  </body>
</html>
