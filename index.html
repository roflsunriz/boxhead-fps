<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boxhead FPS</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23151b20'/%3E%3Cpath d='M16 4v8m0 8v8M4 16h8m8 0h8' stroke='%2365dfdf' stroke-width='3'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="hud">
      <div id="crosshair">
        <span class="crosshair-line top"></span>
        <span class="crosshair-line right"></span>
        <span class="crosshair-line bottom"></span>
        <span class="crosshair-line left"></span>
      </div>
      <div id="hitmarker">✕</div>
      <div id="damage-vignette"></div>
      <div id="death-screen"></div>
      <div id="damage-indicator"><div id="damage-arc"></div></div>
      <div id="action-wrap">
        <div id="action-label"></div>
        <div id="action-track"><div id="action-progress"></div></div>
      </div>
      <div id="minimap-panel">
        <div id="minimap-title" data-i18n="minimapTitle">TACTICAL RADAR</div>
        <canvas id="minimap" width="180" height="180"></canvas>
        <div id="minimap-legend">
          <span class="legend-dot ally"></span><span data-i18n="minimapAlly">ALLY</span>
          <span class="legend-dot enemy"></span><span data-i18n="minimapEnemy">ENEMY</span>
        </div>
      </div>
      <div id="stats">
        <div id="shield-wrap">
          <div id="shield-bar"></div>
          <span id="shield-text">100</span>
        </div>
        <div id="health-wrap">
          <div id="health-bar"></div>
          <span id="health-text">100</span>
        </div>
        <div id="ammo">30 / ∞</div>
        <div id="inventory">
          <span id="stance">STAND</span> · F ◈ <span id="shield-cells">2</span> · G ●
          <span id="grenades">3</span>/5
        </div>
        <div id="score-row">
          <span id="score">0</span> <span data-i18n="pts">pts</span> &nbsp;·&nbsp;
          <span data-i18n="wave">Wave</span> <span id="wave">1</span>
        </div>
        <div id="weather-row">
          <span data-i18n="weatherLabel">Atmosphere:</span> <span id="weather">—</span>
        </div>
      </div>
    </div>

    <div id="system-messages" aria-live="polite"></div>

    <button id="lang-btn" type="button">JA</button>

    <div id="overlay">
      <h1>BOXHEAD<span>FPS</span></h1>
      <p id="overlay-msg" data-i18n="msgStart">
        WASD move · Mouse aim · Hold click full-auto · Right click red-dot aim · C crouch · X prone · F shield
        · G grenade
      </p>
      <button id="start-btn" type="button" data-i18n="play">CLICK TO PLAY</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
